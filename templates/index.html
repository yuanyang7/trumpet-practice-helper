<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trumpet Practice Helper — Add a Song</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header>
  <h1><span class="emoji">🎺</span> Add a Song</h1>
  <p>Paste a YouTube link — detect the key, then save it for practice.</p>
</header>

<div class="wrap">
  <form class="form" id="form">
    <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." required>
    <select id="method" title="Key detection method">
      <option value="cnn">CNN / GiantSteps (more accurate)</option>
      <option value="krumhansl">Krumhansl-Schmuckler (fast)</option>
    </select>
    <button type="submit" id="go">Analyze</button>
  </form>
  <div class="status" id="status"></div>
  <div id="results"></div>
</div>

<footer>Key detection via Krumhansl-Schmuckler · saved songs sync to Supabase for the practice page</footer>

<script src="/static/config.js"></script>
<script src="/static/shared.js"></script>
<script>
const form = document.getElementById('form');
const statusEl = document.getElementById('status');
const goBtn = document.getElementById('go');

// Analyze runs on the Mac (yt-dlp/ffmpeg/librosa). "" = same origin.
const ANALYZE = (window.CONFIG.ANALYZE_API || '').replace(/\/$/, '');

const methodSelect = document.getElementById('method');

wirePlayback();
wireMetronome();
wireEdit();

// Hide the CNN option if the server doesn't have madmom installed.
fetch(ANALYZE + '/methods').then(r => r.json()).then(({ methods }) => {
  if (!methods.includes('cnn')) {
    methodSelect.querySelector('option[value="cnn"]').remove();
  }
}).catch(() => {});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  document.getElementById('results').innerHTML = '';
  statusEl.className = 'status';
  statusEl.textContent = 'Downloading audio and detecting key… (this can take 20–60s)';
  goBtn.disabled = true;

  try {
    const res = await fetch(ANALYZE + '/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, method: methodSelect.value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong');
    renderResult(data, { onSave: saveToSupabase });
    statusEl.textContent = '';
  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = err.message;
  } finally {
    goBtn.disabled = false;
  }
});

async function saveToSupabase(data, btn) {
  if (!SB.configured()) {
    statusEl.className = 'status error';
    statusEl.textContent = 'Supabase not configured — edit static/config.js with your project URL and anon key.';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    await SB.save({ title: data.title, video_id: data.video_id, data });
    btn.classList.add('saved');
    btn.textContent = '✓ Saved';
  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = err.message;
    btn.textContent = '💾 Save';
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
